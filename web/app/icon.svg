<!-- The star from the nav bar, set in a cream disc.

     The site's two colours, as the literal values of `--color-zinc-50` and
     `--color-teal-700`: a static file does not go through Tailwind and cannot
     read the variables. Nothing holds the two in step but this note.

     Outside the disc nothing is painted — that is what makes this a badge
     rather than a cream square sitting on the tab's grey.

     The star keeps the proportions of the one in the bar — the same ratio of
     waist to point, 0.6 against 6.5 — simply set on a larger disc. It is a
     fine line: at sixteen pixels its arms fade out and the badge reads mostly
     by its roundness. Widening the waist would hold them, at the cost of no
     longer being the same star. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <circle cx="16" cy="16" r="16" fill="#faf7f0" />
  <path
    fill="#5f6b3a"
    d="M16 4.5 L17.06 14.94 L27.5 16 L17.06 17.06 L16 27.5 L14.94 17.06 L4.5 16 L14.94 14.94 Z"
  />
</svg>
