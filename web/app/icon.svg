<!-- The broken orbit as the tab's icon: the mark knocked out in paper from an
     olive-deep rounded square, which is what the framework asks for of a favicon.

     Two departures from `components/PolarisMark.tsx`, both required by sixteen
     pixels. The ring is stroked at 3.5 rather than 2.5, or it disappears. And the
     whole drawing is scaled to 0.82 about the centre, to leave a margin inside
     the square.

     The two colours are written out. A file served off disk never passes through
     Tailwind and cannot read a variable: `--paper` is #F1EFE3 and `--olive-deep`
     is #333D22, and nothing but this note holds them in step. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <rect width="48" height="48" rx="10" fill="#333D22" />
  <g transform="translate(24 24) scale(0.82) translate(-24 -24)">
    <path
      d="M 16 12.144 A 16 16 0 1 0 32 12.144"
      stroke="#F1EFE3"
      stroke-width="3.5"
      fill="none"
    />
    <path
      d="M 22.500 7.500 L 25.046 23.954 L 29 26.500 L 25.046 29.046 L 22.500 35.500 L 19.954 29.046 L 16 26.500 L 19.954 23.954 Z"
      fill="#F1EFE3"
    />
  </g>
</svg>
