[project]
name = "evals-playground"
version = "0.1.0"
description = "Playground for composing evaluation runs and grading the conversations they produce"
requires-python = ">=3.11"
dependencies = [
    # 0.3.263 and no less: in 0.3.259, `gpt-6-astra` leaves through Chat
    # Completions with `max_tokens` and OpenAI refuses it ("use
    # max_completion_tokens").
    #
    # And no more, for now. From 0.3.266 a `mockllm` call is counted in a
    # sample's usage, where it used to count nothing, and five tests of
    # tests/test_batch_job.py rest on that nothing: CI failed on main on 22
    # September 2026 and the deploy was skipped. The engine itself is not
    # concerned (a real provider was always counted), but those tests must be
    # rewritten before the bound goes. 0.3.263 is also the version the
    # OpenRouter models were checked live on.
    "inspect-ai==0.3.263",
    # Inspect's providers: each one demands its SDK, without which the model
    # fails silently on the first call — an empty column in the matrix, with no
    # error message.
    # `anthropic` in 1.x is demanded by inspect-ai 0.3.263, which refuses below
    # it: "Anthropic API requires at least version 1.0.0".
    "anthropic>=1.0",
    "openai>=1.0",
    "xai-sdk>=0.1",
    "google-genai>=1.0",
    "pydantic>=2.7",
    # The HTTP client of the Supabase store. The `supabase-py` SDK would drag
    # along its own client, its authentication handling and its query engine for
    # the handful of operations the job makes.
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/playground"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
